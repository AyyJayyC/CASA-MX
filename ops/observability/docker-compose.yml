# Self-hosted error tracking (Bugsink)
#
# Bugsink speaks the Sentry protocol, so the app keeps @sentry/nextjs and only
# the DSN changes. Copy .env.example to .env, fill it, then `docker compose up -d`.
#
# This file is host-agnostic: any Docker host, VPS, or Railway service works.
# If you already run Postgres (Railway), delete the `db` service and point
# DATABASE_URL at a separate database on that server instead.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugsink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bugsink}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h db -U ${POSTGRES_USER:-bugsink}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BUGSINK_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?set BUGSINK_SECRET_KEY in .env}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER:?set BUGSINK_SUPERUSER in .env}
      PORT: 8000
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bugsink}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bugsink}
      BEHIND_HTTPS_PROXY: ${BUGSINK_BEHIND_HTTPS_PROXY:-false}
      USE_X_FORWARDED_HOST: "true"
      USE_X_REAL_IP: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

volumes:
  db-data:
